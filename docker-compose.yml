version: '3.8'

services:
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    networks:
      - jasmin-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=test123
    networks:
      - jasmin-network

  jasmin:
    build: .
    ports:
      - "2775:2775"
      - "1401:1401"
      - "8990:8990"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=test123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=test123
      - RABBITMQ_USE_SSL=false
      - JASMIN_INTERFACES=sm-http
      - API_KEY=test123
    depends_on:
      - redis
      - rabbitmq
    networks:
      - jasmin-network

networks:
  jasmin-network:
    driver: bridge
