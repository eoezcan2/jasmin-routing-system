services:
  jasmin:
    build: .
    container_name: jasmin
    depends_on:
      - redis
      - rabbitmq
    ports:
      - "2775:2775"   # SMPP
      - "1401:1401"   # HTTP API
      - "8990:8990"   # CLI
    environment:
      - JASMIN_INTERFACES=sm-http
    networks:
      - jasmin-net
    volumes:
      - ./config/scripts:/opt/jasmin-scripts

  # web-panel:
  #   image: tarekaec/jasmin_web_panel:1.3
  #   container_name: web-panel
  #   depends_on:
  #     - jasmin
  #   ports:
  #     - "8080:80"      # Web Panel
  #   networks:
  #     - jasmin-net

  redis:
    image: redis:6  
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - jasmin-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # RabbitMQ management UI
    networks:
      - jasmin-net

networks:
  jasmin-net:
    driver: bridge
